function speak(text) {
    if(text === lastSpoken) return;
    lastSpoken = text;

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = (currentLang === "ar") ? "ar-SA" : "en-US";
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
}

// تحديد MITRE حسب نوع الهجوم
function detectMitre(text) {
    if(text.includes("otp") || text.includes("password") || text.includes("verify"))
        return "T1110 - Credential Access";
    
    if(text.includes("click") || text.includes("link") || text.includes("http"))
        return "T1566 - Phishing";

    if(text.includes("bank") || text.includes("transfer") || text.includes("iban"))
        return "T1657 - Financial Theft";

    if(text.includes("download") || text.includes("install"))
        return "T1204 - Malware Execution";

    return "T1566 - Phishing";
}

// تحليل الرسالة
function startAnalysis() {
    let text = msgInput.value.toLowerCase();
    if(text.length < 2) return;

    let score = 0;
    let hits = 0;

    const suspiciousKeywords = [...]; // خله نفس قائمتك بدون تغيير

    suspiciousKeywords.forEach(k => {
        if(text.includes(k.toLowerCase())) {
            hits++;
            score += 15;

            if(k.length > 6) score += 10;
            if(k.includes("http") || k.includes("click") || k.includes("انقر")) score += 25;
        }
    });

    // روابط مباشرة
    if(/https?:\/\/|www\./.test(text)) {
        score += 30;
    }

    // كثافة الكلمات
    if(hits > 5) score += 20;

    if(score > 100) score = 100;

    updateUI(score, text);
}

function updateUI(score, text) {
    const bar = document.getElementById("bar");
    const scoreVal = document.getElementById("score");
    const statusLabel = document.getElementById("statusLabel");
    const recBox = document.getElementById("recBox");
    const recContent = document.getElementById("recContent");
    const mitreDiv = document.getElementById("mitreDiv");
    const incidentDiv = document.getElementById("incidentDiv");

    scoreVal.innerText = score;
    bar.style.width = score + "%";

    if(score > 30) {
        matrixColor = "#ff0033";
        bar.classList.add("danger-bar");
        statusLabel.classList.add("danger-text");

        statusLabel.innerText = (currentLang==="ar")?
        "حالة التهديد: خطر عالي جداً":
        "Threat Status: HIGH RISK";

        let recText = (currentLang==="ar")?
        "تحذير: هذه الرسالة تبدو كتصيد احتيالي. لا تضغط أي رابط أو تدخل بياناتك":
        "Warning: This message appears to be phishing. Do not click links or enter data";

        recContent.innerText = recText;

        // MITRE حقيقي
        let mitre = detectMitre(text);
        mitreDiv.innerText = "MITRE: " + mitre;

        // Incident متغير
        incidentDiv.innerText = "Incident ID: " + generateIncident();

        mitreDiv.style.display = "block";
        incidentDiv.style.display = "block";
        recBox.style.display = "block";

        speak(recText);

    } else {
        matrixColor = "#00ffcc";
        bar.classList.remove("danger-bar");
        statusLabel.classList.remove("danger-text");

        statusLabel.innerText = (currentLang==="ar")?
        "حالة التهديد: آمن":
        "Threat Status: CLEAN";

        mitreDiv.style.display = "none";
        incidentDiv.style.display = "none";
        recBox.style.display = "none";

        if(msgInput.value.length > 5){
            speak((currentLang==="ar")?"الحالة آمنة":"Status is safe");
        }
    }
}
