<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>BlackFalcon SOC</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{ --neon-green:#00ffcc; --danger-red:#ff0033; }
body{ margin:0; background:black; color:var(--neon-green); font-family:'Orbitron',sans-serif; overflow-x:hidden; }
canvas{ position:fixed; top:0; left:0; z-index:-1; }
.container{ text-align:center; margin-top:40px; }

textarea{ 
    width:85%; height:130px; background:rgba(0,0,0,0.7); 
    border:2px solid var(--neon-green); border-radius:15px; 
    padding:20px; color:var(--neon-green); 
}

.card{ width:80%; margin:25px auto; padding:25px; border-radius:20px; background:rgba(0,0,0,0.8); }
.bar-container { width:100%; height:10px; background:#222; border-radius:10px; }
.bar{ height:100%; background:var(--neon-green); width:0%; }

.recommendation-box { 
    width:80%; margin:20px auto; padding:15px; 
    border:1px solid var(--danger-red); border-radius:10px; 
    display:none; 
}

.danger-bar { background: var(--danger-red) !important; }
.danger-text { color: var(--danger-red) !important; }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
    <h1>🦅 BlackFalcon SOC</h1>

    <button onclick="toggleLang()">EN / AR</button>

    <textarea id="msg" placeholder="الصق الرسالة هنا..."></textarea>

    <div class="card">
        <div id="statusLabel">Threat Status: CLEAN</div>
        <div>Risk Score: <span id="score">0</span>%</div>
        <div class="bar-container"><div class="bar" id="bar"></div></div>
        <div id="mitreDiv" style="display:none;">MITRE: T1566</div>
    </div>

    <div id="recBox" class="recommendation-box">
        <span id="recContent"></span>
    </div>
</div>

<script>
let currentLang = "ar";
let lastSpoken = ""; // 🔥 يمنع التكرار
const msgInput = document.getElementById("msg");

/* ================= صوت ================= */
function speak(text){
    if(text === lastSpoken) return;
    lastSpoken = text;

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = (currentLang === "ar") ? "ar-SA" : "en-US";
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
}

/* ينطق عند التركيز */
msgInput.addEventListener("focus", ()=>{
    speak(currentLang==="ar"
        ? "أنت الآن في مربع إدخال النص"
        : "You are now in the text input field");
});


/* ================= كلمات مشبوهة ================= */
const suspiciousKeywords = [
    "http","login","verify","password","otp","bank","click","urgent"
    // 👇 أضف كلماتك هنا
];


/* ================= توصيات ================= */
function getRecommendation(text){
    if(text.includes("http") || text.includes("click")){
        return currentLang==="ar"
        ? "🎣 تصيد محتمل لا تضغط الروابط وتحقق من المصدر"
        : "🎣 Phishing do not click links and verify source";
    }

    if(text.includes("password") || text.includes("otp")){
        return currentLang==="ar"
        ? "🔐 لا تشارك بياناتك وفعّل التحقق الثنائي"
        : "🔐 Do not share credentials enable MFA";
    }

    if(text.includes("bank")){
        return currentLang==="ar"
        ? "💳 تحقق من الجهة قبل أي عملية مالية"
        : "💳 Verify before any financial transaction";
    }

    return currentLang==="ar"
    ? "⚠️ نشاط مشبوه تجاهل الرسالة وابلغ الأمن"
    : "⚠️ Suspicious activity ignore and report";
}


/* ================= تحليل ================= */
msgInput.addEventListener("input", ()=>{
    let text = msgInput.value.toLowerCase();
    let score = 0;

    suspiciousKeywords.forEach(k=>{
        if(text.includes(k)){
            score += 20;
        }
    });

    if(score > 100) score = 100;

    updateUI(score, text);
});


/* ================= واجهة ================= */
function updateUI(score, text){
    const bar = document.getElementById("bar");
    const scoreVal = document.getElementById("score");
    const statusLabel = document.getElementById("statusLabel");
    const recBox = document.getElementById("recBox");
    const recContent = document.getElementById("recContent");

    scoreVal.innerText = score;
    bar.style.width = score + "%";

    if(score > 30){
        bar.classList.add("danger-bar");
        statusLabel.classList.add("danger-text");

        statusLabel.innerText = (currentLang==="ar")
        ? "حالة التهديد: غير آمن"
        : "Threat Status: UNSAFE";

        let rec = getRecommendation(text);
        recContent.innerText = rec;
        recBox.style.display = "block";

        document.getElementById("mitreDiv").style.display = "block";

        speak(rec); // 🔥 ينطق التوصية
    }else{
        bar.classList.remove("danger-bar");
        statusLabel.classList.remove("danger-text");

        statusLabel.innerText = (currentLang==="ar")
        ? "حالة التهديد: آمن"
        : "Threat Status: CLEAN";

        recBox.style.display = "none";
        document.getElementById("mitreDiv").style.display = "none";

        if(text.length > 5){
            speak(currentLang==="ar"
            ? "الحالة آمنة"
            : "Status is safe");
        }
    }
}


/* ================= لغة ================= */
function toggleLang(){
    currentLang = (currentLang==="ar") ? "en" : "ar";
    msgInput.placeholder = (currentLang==="ar")
    ? "الصق الرسالة هنا..."
    : "Paste message here...";

    speak(currentLang==="ar"?"تم تغيير اللغة":"Language changed");
}


/* ================= Matrix ================= */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const drops = Array(100).fill(1);

setInterval(()=>{
    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#00ffcc";
    drops.forEach((y,i)=>{
        ctx.fillText(Math.random()>0.5?"0":"1",i*10,y*10);
        drops[i]++;
    });
},33);

</script>

</body>
</html>
