<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>BlackFalcon SOC</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{ --neon-green:#00ffcc; --danger-red:#ff0033; }
body{ margin:0; background:black; color:var(--neon-green); font-family:'Orbitron',sans-serif; overflow-x:hidden; transition:0.4s; }
canvas{ position:fixed; top:0; left:0; z-index:-1; }
.container{ text-align:center; margin-top:40px; padding-bottom: 50px; }

h1{ font-size:35px; text-shadow:0 0 15px var(--neon-green); margin-bottom: 5px; color: var(--neon-green) !important; }
.sub-title { font-size: 14px; letter-spacing: 2px; margin-bottom: 20px; color: var(--neon-green); }

textarea{ 
    width:85%; height:130px; background:rgba(0,0,0,0.7); 
    border:2px solid var(--neon-green) !important; 
    border-radius:15px; padding:20px; color:var(--neon-green) !important; 
    box-shadow:0 0 10px var(--neon-green) !important; 
    font-size: 18px; outline: none; 
}

.card{ width:80%; margin:25px auto; padding:25px; border-radius:20px; background:rgba(0,0,0,0.8); box-shadow:0 0 20px var(--neon-green); text-align: left; }
.bar-container { width: 100%; height: 10px; background: #222; border-radius: 10px; margin: 15px 0; overflow: hidden; }
.bar{ height:100%; background:var(--neon-green); width:0%; transition:0.8s; }

.recommendation-box { 
    width: 80%; margin: 20px auto; padding: 15px; 
    border: 1px solid var(--danger-red); border-radius: 10px; 
    background: rgba(255, 0, 51, 0.1); color: white; 
    display: none; text-align: center;
}

button{ padding:8px 20px; border:1px solid var(--neon-green); background:transparent; color:var(--neon-green); cursor:pointer; border-radius:10px; font-family: 'Orbitron'; }

.danger-bar { background: var(--danger-red) !important; }
.danger-text { color: var(--danger-red) !important; }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
    <h1>🦅 BlackFalcon SOC</h1>
    <div class="sub-title">Advanced Security Operations Platform</div>

    <button onclick="toggleLang()">EN / AR</button>

    <textarea id="msg" placeholder="الصق الرسالة هنا..."></textarea>

    <div class="card">
        <div id="statusLabel">Threat Status: CLEAN</div>
        <div>Risk Score: <span id="score">0</span>%</div>
        <div class="bar-container"><div class="bar" id="bar"></div></div>

        <div id="mitreDiv" style="display:none;">MITRE: T1566 - Phishing</div>
        <div id="incidentDiv" style="display:none;">Incident ID: INC-943219</div>
    </div>

    <div id="recBox" class="recommendation-box">
        <span id="recContent"></span>
    </div>
</div>

<script>
let currentLang = "ar";
let matrixColor = "#00ffcc";
let msgInput = document.getElementById("msg");

function detectAttack(text){
    if(text.includes("http") || text.includes("click") || text.includes("login") || text.includes("verify")) return "phishing";
    if(text.includes("bank") || text.includes("credit") || text.includes("بطاقة") || text.includes("دفع")) return "financial";
    if(text.includes("download") || text.includes("install") || text.includes("تحميل") || text.includes("تثبيت")) return "malware";
    if(text.includes("otp") || text.includes("password") || text.includes("كلمة المرور")) return "credential";
    return "unknown";
}

function getRecommendation(type){
    if(type==="phishing"){
        return currentLang==="ar"
        ? "🚨 يشتبه بمحاولة تصيد احتيالي: لا تضغط على الروابط، تحقق من الرابط يدوياً، لا تدخل بياناتك، وفعّل التحقق الثنائي (MFA)."
        : "🚨 Phishing suspected: Do not click links, verify URLs manually, never enter credentials, enable MFA.";
    }
    if(type==="financial"){
        return currentLang==="ar"
        ? "💰 احتيال مالي محتمل: لا ترسل أموال، تحقق من المصدر، تواصل مع الجهة الرسمية مباشرة، وراقب حساباتك البنكية."
        : "💰 Financial scam detected: Do not send money, verify source, contact official entity, monitor bank accounts.";
    }
    if(type==="malware"){
        return currentLang==="ar"
        ? "🦠 خطر برمجيات خبيثة: لا تقم بالتحميل، استخدم برنامج حماية، افحص الجهاز فوراً، واعزل الملف المشبوه."
        : "🦠 Malware risk: Do not download, use antivirus, scan device immediately, isolate suspicious files.";
    }
    if(type==="credential"){
        return currentLang==="ar"
        ? "🔐 محاولة سرقة بيانات: لا تشارك كلمة المرور أو OTP، غيّر كلمات المرور فوراً، وفعّل الحماية المتقدمة."
        : "🔐 Credential theft attempt: Do not share password/OTP, change passwords immediately, enable advanced security.";
    }
    return currentLang==="ar"
    ? "⚠️ نشاط مشبوه: تحقق من المصدر، لا تتفاعل مع الرسالة، وابلغ فريق الأمن."
    : "⚠️ Suspicious activity: Verify source, do not engage, report to security team.";
}

function getMITRE(type){
    switch(type){
        case "phishing": return "T1566 - Phishing";
        case "financial": return "T1657 - Financial Fraud";
        case "malware": return "T1204 - User Execution";
        case "credential": return "T1556 - Credential Access";
        default: return "T1599 - Unknown";
    }
}

        if(text.includes(k)) {
            score+=20;
            if(k.length>6) score+=10;
            if(k.includes("click") || k.includes("http")) score+=20;
        }
    });

    if(score>100) score=100;

    let attack = detectAttack(text);
    let mitre = getMITRE(attack);
    let rec = getRecommendation(attack);

    updateUI(score, mitre, rec);
}

function updateUI(score, mitre, rec){
    document.getElementById("score").innerText = score;
    document.getElementById("bar").style.width = score+"%";

    if(score>30){
        document.getElementById("statusLabel").innerText = "Threat Status: HIGH RISK";
        document.getElementById("mitreDiv").style.display="block";
        document.getElementById("incidentDiv").style.display="block";
        document.getElementById("recBox").style.display="block";

        document.getElementById("mitreDiv").innerText = "MITRE: "+mitre;
        document.getElementById("recContent").innerText = rec;
    }
}

msgInput.addEventListener("input", ()=> setTimeout(startAnalysis,1500));

function toggleLang(){
    currentLang = currentLang==="ar"?"en":"ar";
}
